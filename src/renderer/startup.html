<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Auto Karaoke Player</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0c0e14; color: #f9fafb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
    main { display: grid; justify-items: center; gap: 16px; }
    .app-icon { width: 64px; height: 64px; }
    strong { font-size: 17px; letter-spacing: .02em; }
    span { color: #9ca3af; font-size: 13px; }
  </style>
</head>
<body><main><img class="app-icon" src="./icons/app.svg" width="64" height="64" alt=""><strong>本地唱片室</strong><span>正在打开曲库…</span></main></body>
</html>
