<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Auto Karaoke Player</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0c0e14; color: #f9fafb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
    main { display: grid; justify-items: center; gap: 16px; }
    .disc { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle, #0c0e14 0 10%, #c084fc 11% 17%, #272b37 18% 48%, #171a22 49% 100%); box-shadow: 0 10px 35px #0008; animation: spin 1.8s linear infinite; }
    strong { font-size: 17px; letter-spacing: .02em; }
    span { color: #9ca3af; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .disc { animation: none; } }
  </style>
</head>
<body><main><div class="disc" aria-hidden="true"></div><strong>本地唱片室</strong><span>正在打开曲库…</span></main></body>
</html>
