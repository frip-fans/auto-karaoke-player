<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Karaoke · 观众屏幕</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;color:#eee;font:14px system-ui;overflow:hidden}
    body{display:flex;flex-direction:column}
    #audience-titlebar{height:44px;flex-shrink:0;display:flex;align-items:center;padding:0 calc(var(--caption-right,0px) + 52px) 0 calc(var(--caption-left,0px) + 16px);background:#000;border-bottom:1px solid #171717;-webkit-app-region:drag;user-select:none}
    #audience-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b8b8b8;font-size:12px}
    #audience-stage{position:relative;flex:1;min-height:0}
    video{width:100%;height:100%;object-fit:contain;display:block}
    #hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
    #audience-fullscreen{position:fixed;top:6px;right:calc(var(--caption-right,0px) + 8px);z-index:10;width:32px;height:32px;display:grid;place-items:center;padding:0;background:#171717;color:#eee;border:1px solid #333;border-radius:6px;cursor:pointer;transition:opacity 120ms ease;-webkit-app-region:no-drag}
    #audience-fullscreen:hover{background:#303030}
    #audience-fullscreen:focus-visible{outline:2px solid #ff8a00;outline-offset:2px}
    body.idle #audience-fullscreen:not(:focus-visible){opacity:0;pointer-events:none}
    #audience-fullscreen .exit-fullscreen{display:none}
    body.is-fullscreen #audience-titlebar{height:0;padding:0;border:0}
    body.is-fullscreen #audience-title{display:none}
    body.is-fullscreen #audience-fullscreen{top:10px;right:10px;background:#151515b3}
    body.is-fullscreen #audience-fullscreen .enter-fullscreen{display:none}
    body.is-fullscreen #audience-fullscreen .exit-fullscreen{display:block}
    body.is-fullscreen.idle{cursor:none}
    @media(prefers-reduced-motion:reduce){#audience-fullscreen{transition:none}}
  </style>
</head>
<body>
  <header id="audience-titlebar"><span id="audience-title">观众窗口 · 拖动此栏移动到电视或投影仪</span></header>
  <button id="audience-fullscreen" type="button" title="全屏" aria-label="全屏" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-maximize enter-fullscreen" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minimize exit-fullscreen" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg></button>
  <main id="audience-stage"><video muted playsinline></video><div id="hint">等待点歌…</div><div id="next-song" class="next-song-overlay" hidden></div></main>
  <script type="module" src="/display.ts"></script>
</body>
</html>
